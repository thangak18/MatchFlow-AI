name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "./MatchFlow AI/backend"

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx ruff

    - name: Lint with Ruff
      continue-on-error: true
      run: ruff check .

    - name: Test with pytest
      env:
        # Provide dummy env vars for tests if needed
        GEMINI_API_KEY: "dummy-key"
      run: pytest tests/

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "./MatchFlow AI/frontend"

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: "./MatchFlow AI/frontend/package-lock.json"

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      continue-on-error: true
      run: npm run lint

    - name: Build Next.js
      env:
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
      run: npm run build
